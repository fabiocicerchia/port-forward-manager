      Declarative kubectl port-forward orchestrator — define your forwards in YAML, keep them alive, and
      manage them as a group with one command.
  annotations:
    github.com/project-slug: fabiocicerchia/port-forward-manager
    backstage.io/source-location: url:https://github.com/fabiocicerchia/port-forward-manager/
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/fabiocicerchia/port-forward-manager
      title: Source
spec:
  type: library
  lifecycle: production
  owner: group:default/kodebeat
  system: oss-tools
