site_name: port-forward-manager
site_description: Manage multiple kubectl port-forwards with auto-reconnect.
repo_url: https://github.com/fabiocicerchia/port-forward-manager
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: README.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
