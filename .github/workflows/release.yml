name: release

# release-please reads Conventional Commit messages on main and keeps an open
# "release PR" with the next version bump + CHANGELOG. Merging that PR tags the
# release (vX.Y.Z), publishes a GitHub Release, and the upload-assets job then
# attaches the pfm script + checksum for curl installs.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    permissions:
      contents: write # create tags & releases
      pull-requests: write # open/update the release PR
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: rp
        with:
          # "simple" is language-agnostic (tracks version.txt + CHANGELOG).
          # Manifest mode: release-please-config.json sets `draft: true` so the
          # GitHub Release is created unpublished. Immutable releases reject asset
          # uploads once a release is published, so assets must land while it is
          # still a draft; a later step flips it to published.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  upload-assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Checksum
        run: sha256sum pfm > pfm.sha256
      - name: Attach pfm + checksum to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" pfm pfm.sha256 --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish the draft release
        # Assets can only be attached while the release is a draft;
        # publishing last is what leaves it immutable with assets intact.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false --repo "$GITHUB_REPOSITORY"

  # Building the image has to hang off this job rather than off the release
  # event: the release release-please publishes carries GITHUB_TOKEN, and
  # GitHub does not start workflows from GITHUB_TOKEN events. Called in the
  # same run, it just works — no PAT to mint, rotate, or leak.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
